name: Update A-GPS file

on:
  schedule:
    - cron: "23 15 * * *"      # daily at 15:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agps
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and check the file
        run: python -m agps.generate --out out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view current >/dev/null 2>&1 || gh release create current --title "Current A-GPS file" --notes "NML_28A.ee for Nikon D5300 and COOLPIX P330/P510/P520. Replaced automatically every day."
          gh release upload current out/NML_28A.ee --clobber
          cp out/status.md status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.md
          git commit -m "Status $(date -u +%F)" || echo "unchanged"
          git pull --rebase
          git push
