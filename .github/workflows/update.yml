yaml

name: A-GPS-File update

on:
  schedule:
    - cron: "00 08 * * *"      # taeglich 15:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agps
  cancel-in-progress: false

jobs:
  erzeugen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Datei erzeugen und pruefen
        run: python -m agps.generate --out out
      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view aktuell >/dev/null 2>&1 || gh release create aktuell --title "Aktuelle A-GPS-Datei" --notes "NML_28A.ee fuer Nikon D5300, COOLPIX P330/P510/P520. Wird taeglich automatisch ersetzt."
          gh release upload aktuell out/NML_28A.ee --clobber
          cp out/status.md status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.md
          git commit -m "Status $(date -u +%F)" || echo "unveraendert"
          git push
